<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: rgba(31, 40, 51, 0.6);
            --primary-accent: #66fcf1;
            --text-main: #ffffff;
            --text-muted: #c5c6c7;
            --glass-border: rgba(102, 252, 241, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Gradients */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(69,162,158,0.15) 0%, rgba(11,12,16,0) 70%);
            border-radius: 50%;
            top: -200px;
            left: -200px;
            z-index: -1;
            animation: pulse 8s infinite alternate;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(102,252,241,0.1) 0%, rgba(11,12,16,0) 70%);
            border-radius: 50%;
            bottom: -150px;
            right: -150px;
            z-index: -1;
            animation: pulse 6s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.8; }
            100% { transform: scale(1.2) translate(50px, 50px); opacity: 1; }
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            z-index: 10;
        }

        .header-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--primary-accent);
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Glassmorphism Links Hub */
        .links-hub {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 24px;
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .contact-btn svg {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .contact-btn span {
            flex-grow: 1;
        }
        
        .contact-btn .arrow {
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
        }

        /* Hover Effects per Button */
        .contact-btn:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: transparent;
        }

        .contact-btn:hover svg {
            transform: scale(1.1);
        }
        
        .contact-btn:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* Call - Teal Gradient */
        .btn-call:hover {
            background: linear-gradient(135deg, #00F2FE, #4FACFE);
            box-shadow: 0 15px 30px rgba(79, 172, 254, 0.4);
        }

        /* WhatsApp - Green Gradient */
        .btn-whatsapp:hover {
            background: linear-gradient(135deg, #25D366, #128C7E);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4);
        }

        /* Email - Coral Gradient */
        .btn-email:hover {
            background: linear-gradient(135deg, #FF512F, #DD2476);
            box-shadow: 0 15px 30px rgba(255, 81, 47, 0.4);
        }

        /* LinkedIn - Blue Gradient */
        .btn-linkedin:hover {
            background: linear-gradient(135deg, #0077b5, #005582);
            box-shadow: 0 15px 30px rgba(0, 119, 181, 0.4);
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            h1 {
                font-size: 2rem;
            }
            .contact-btn {
                padding: 16px 20px;
                font-size: 1.1rem;
            }
        }

        /* Back Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 24px;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }
        .back-link:hover {
            color: var(--primary-accent);
            transform: translateX(-5px);
        }
    </style>
</head>

    <script>
        // Entrance animation logic
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.contact-btn');
            buttons.forEach((btn, index) => {
                btn.style.opacity = '0';
                btn.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    btn.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    btn.style.opacity = '1';
                    btn.style.transform = 'translateY(0)';
                    
                    // Reset transition to normal hover state after entrance animation finishes
                    setTimeout(() => {
                        btn.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    }, 500);
                }, 100 + (index * 150));
            });
        });
    </script>
